<style>:root{color-scheme:light;--bg:#f8fafc;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#2563eb;--brand2:#0ea5e9;--soft:#eff6ff;--good:#15803d;--bad:#b91c1c;--shadow:0 8px 28px rgba(15,23,42,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.topbar{background:#0f172a;color:#cbd5e1;font-size:.88rem}.topbar .wrap{display:flex;justify-content:space-between;gap:12px;padding:8px 0}.header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.headrow{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 0}.logo{font-weight:850;font-size:1.35rem;letter-spacing:-.04em;color:var(--ink)}.logo span{color:var(--brand)}nav{display:flex;flex-wrap:wrap;gap:8px}nav a{padding:8px 10px;border-radius:9px;color:#334155;font-size:.92rem}nav a:hover,nav a.active{background:var(--soft);color:var(--brand);text-decoration:none}.hero{padding:56px 0 32px;background:radial-gradient(ellipse at top right,#dbeafe 0,transparent 48%),linear-gradient(180deg,#fff,#f8fafc)}.uniq{font-family:"Sora",system-ui,"Segoe UI",sans-serif;letter-spacing:-.025em;font-weight:700;background:linear-gradient(90deg,#7c3aed,#e11d48);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:#7c3aed}.eyebrow{display:inline-block;color:var(--brand);font-weight:750;font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}.hero h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.08;letter-spacing:-.05em;max-width:820px;margin:12px 0}.hero p{max-width:760px;color:#475569;font-size:1.1rem}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 15px;font-weight:700;transition:.15s}.btn:hover{transform:translateY(-1px);text-decoration:none}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.small{padding:7px 10px;font-size:.88rem}.btn.danger{color:var(--bad)}main{padding:26px 0 60px}.section-title{font-size:1.55rem;letter-spacing:-.03em;margin:0 0 8px}.sub{color:var(--muted);margin:0 0 20px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}.sidebar,.panel,.tool-card,.info-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.sidebar{padding:16px;position:sticky;top:90px}.sidebar h3{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}.side-links{display:grid;gap:4px}.side-links a{padding:8px 10px;border-radius:8px;color:#334155;font-size:.94rem}.side-links a:hover{background:var(--soft);text-decoration:none}.tool-area{min-width:0}.panel{padding:22px;margin-bottom:18px;scroll-margin-top:100px}.panel h2{margin:0 0 5px;font-size:1.35rem;letter-spacing:-.025em}.panel .desc{margin:0 0 18px;color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:.92rem;margin-bottom:6px}.input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:10px 12px;color:var(--ink);min-width:0}.input:focus,textarea:focus,select:focus{outline:3px solid #bfdbfe;border-color:var(--brand)}textarea{min-height:130px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92rem}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .btn{flex:0 0 auto}.output{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-wrap:anywhere;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92rem;min-height:48px}.status{font-size:.9rem;margin-top:8px;min-height:1.4em}.status.good{color:var(--good)}.status.bad{color:var(--bad)}.checks{display:flex;flex-wrap:wrap;gap:14px}.checks label{display:flex;align-items:center;gap:7px;font-size:.92rem;font-weight:500}.checks input{accent-color:var(--brand)}.tool-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0 30px}.tool-card{padding:18px;box-shadow:none}.tool-card h3{margin:0 0 5px;font-size:1.05rem}.tool-card p{color:var(--muted);font-size:.92rem;margin:0}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:22px 0}.info-card{padding:20px;box-shadow:none}.info-card h3{margin:0 0 8px}.content{max-width:850px}.content h2{margin-top:28px}.content p,.content li{color:#475569}.faq details{padding:14px 0;border-bottom:1px solid var(--line)}.faq summary{font-weight:750;cursor:pointer}.footer{background:#0f172a;color:#cbd5e1;padding:30px 0}.footer .footrow{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer a{color:#e2e8f0}.footer p{margin:8px 0 0;color:#94a3b8;font-size:.9rem}.hidden{display:none!important}.notice{padding:12px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;color:#1e40af;font-size:.92rem}.pill{display:inline-block;background:#f1f5f9;color:#475569;border-radius:999px;padding:3px 9px;font-size:.78rem;font-weight:700}.muted{color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:static}.side-links{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.headrow{align-items:flex-start;flex-direction:column}.header{position:static}}@media(max-width:560px){.wrap{width:min(100% - 22px,1120px)}.hero{padding:38px 0 24px}.tool-grid,.info-grid{grid-template-columns:1fr}.panel{padding:16px}.topbar .wrap{display:block}.side-links{grid-template-columns:1fr}.row>*{flex-basis:100%}.row .btn{flex:1}}
.gen{max-width:820px;margin:26px 0 12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;color:var(--ink)}
.gen-head{background:#f8f8f8;border-bottom:1px solid var(--line);padding:14px 18px;text-align:center}
.gen-head h2{margin:0;font-size:clamp(1.5rem,4.2vw,2.3rem);letter-spacing:-.03em}
.gen-body{padding:22px clamp(16px,4vw,32px) 28px}
.gen .hidden,.gen [hidden]{display:none!important}
.seg{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.seg button{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;font-weight:600;color:#334155}
.seg button.on{background:#0a0a0a;border-color:#0a0a0a;color:#fff}
.ns{display:grid;gap:8px;max-width:420px;margin:0 auto 16px}
.ns select,.ns input,.opts select,.bulk input{border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;background:#fff;color:var(--ink)}
.center{text-align:center}
.bigbtn{background:#0a0a0a;color:#fff;border:0;border-radius:12px;padding:14px 26px;font-size:clamp(1.05rem,3.6vw,1.5rem);font-weight:600}
.bigbtn:hover,.blk:hover{background:#2a2a2a}
.single{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:18px 0 4px}
.single code{font-family:ui-monospace,Consolas,monospace;font-size:clamp(.9rem,3.3vw,1.35rem);overflow-wrap:anywhere;background:#f4f1ff;border:1px solid #e3dcff;border-radius:8px;padding:8px 12px;color:#4c1d95}
.opts{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-top:16px;font-size:.95rem}
.gen hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.gen h3{margin:0 0 10px;font-size:1.5rem;font-weight:500;letter-spacing:-.02em}
.bulk{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bulk input{width:150px}
.blk{background:#0a0a0a;color:#fff;border:0;border-radius:8px;padding:10px 20px;font-weight:600}
.gen textarea{width:100%;min-height:150px;margin-top:14px;font-family:ui-monospace,Consolas,monospace;border:1px solid #cbd5e1;border-radius:8px;padding:10px}
.gen p{font-size:1rem;max-width:none;color:#475569;margin:0}
.dd{position:relative}.ddt{border:0;background:none;font:inherit;font-size:.92rem;padding:8px 10px;border-radius:9px;color:#334155;cursor:pointer}.ddt:hover,.dd.open .ddt{background:var(--soft);color:var(--brand)}.ddm{max-height:calc(100vh - 110px);overflow-y:auto;display:none;position:absolute;left:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:230px;max-width:calc(100vw - 32px);z-index:30;flex-direction:column}.dd.open .ddm,.dd:hover .ddm{display:flex}.ddm a{white-space:nowrap}#uuid-tools,#guid-tools{scroll-margin-top:84px}.dd.shut .ddm{display:none!important}@media(max-width:700px){.dd+.dd .ddm{left:auto;right:0}}.logo{display:inline-flex;align-items:center;gap:10px}.logo:hover{text-decoration:none}.logo .mark{flex:none}.logo b{font-weight:850}.logo span{background:linear-gradient(90deg,#7c3aed,#e11d48);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.uniq{font-family:Sora,system-ui,"Segoe UI",sans-serif}
.dd:hover .ddm{display:none}.dd.open .ddm{display:flex}
.rel{display:flex;flex-wrap:wrap;gap:8px 22px;padding:0;list-style:none}
.seg a{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;font-weight:600;color:#334155}.seg a.on{background:#0a0a0a;border-color:#0a0a0a;color:#fff}
</style></head>

r or group ID, and the domain is stored in the clock sequence. It is rarely used in modern software and many libraries do not support it. Pick a domain and a local ID above to build one.",3:"A Version 3 UUID is generated from a namespace and a name using the MD5 hash. The same inputs always produce the same UUID. MD5 is weak for security, so Version 5 is usually preferred for new work, but Version 3 is still useful when you must match an existing system.",4:"A Version 4 UUID is a 128-bit identifier made from random numbers. This page creates them with your browser\u2019s secure random number generator, so nothing is sent to a server.",5:"A Version 5 UUID is built from a namespace and a name using SHA-1. The same namespace and name always produce the same UUID.",6:"A Version 6 UUID is a reordered Version 1 UUID. The timestamp bits are rearranged so the most significant part comes first, which makes values sort by creation time. It exists to help systems that already use Version 1. For new projects, Version 7 is usually the better choice.",7:"A Version 7 UUID starts with a millisecond Unix timestamp followed by random bits, so values sort in the order they were created. That makes them a good fit for database keys.",8:"A Version 8 UUID is reserved for custom, vendor-specific layouts. The standard fixes only the version and variant bits, and you decide what the other 122 bits mean. This page fills them with random data so you can see a valid Version 8 UUID. To use your own layout, set the bytes in your code."},Wv=[{slug:"guid-generator",title:"GUID Generator",desc:"Create GUIDs in the Microsoft style, with braces and uppercase letters if you need them. Pick a type and a format, then copy or download.",ver:"4",fmt:"B",up:!0,n:5,text:[["GUID or UUID?","A GUID is Microsoft's name for a UUID. Both are 128-bit identifiers with the same layout. GUIDs appear in .NET, SQL Server uniqueidentifier columns, the Windows registry and COM. They are usually written in uppercase, sometimes inside braces."],["Which type should I choose?","Random (v4) is the standard choice. Time-ordered (v7) values sort by creation time. COMB GUIDs are designed to sort well in SQL Server."]]},{slug:"random-guid-generator",title:"Random GUID Generator",desc:"Generate random GUIDs in bulk for test data, seed scripts and placeholders.",ver:"4",fmt:"D",up:!1,n:10,text:[["What is a random GUID?","A random GUID is a version 4 value. Of its 128 bits, 122 come from a secure random number generator, so collisions are so unlikely that you can treat each value as unique in practice."],["Common uses","Seeding databases, filling test fixtures, creating mock API responses and naming temporary files."]]},{slug:"guid-v4-generator",title:"GUID v4 Generator",desc:"Create version 4 GUIDs. This is the type produced by Guid.NewGuid() in .NET.",ver:"4",fmt:"D",up:!1,n:5,text:[["What does v4 mean?","The 4 is the version number, stored at the start of the third group. The first digit of the fourth group is always 8, 9, a or b. Everything else is random."],["When to use v4","Use it whenever you only need a unique value. For large database tables where insert speed matters, consider v7 or a COMB GUID."]]},{slug:"guid-v7-generator",title:"GUID v7 Generator",desc:"Create time-ordered version 7 GUIDs that sort by creation time.",ver:"7",fmt:"D",up:!1,n:5,text:[["What is a v7 GUID?","A v7 GUID starts with a 48-bit Unix timestamp in milliseconds, followed by random bits. New values are larger than older ones, which keeps database indexes tidy."],["SQL Server note","SQL Server does not sort uniqueidentifier values from the left, so v7 values will not appear in creation order there. For SQL Server, a COMB GUID is the better fit. In .NET 9 and later you can create v7 GUIDs in code with Guid.CreateVersion7()."]]},{slug:"online-guid-generator",title:"Online GUID Generator",desc:"Generate GUIDs in your browser with no install and no sign-up.",ver:"4",fmt:"D",up:!1,n:5,text:[["Free and private","This generator runs entirely in your browser using the Web Crypto API. Nothing you generate is sent to a server or stored."],["How to use it","Choose how many GUIDs you need, pick a type and a format, and select Generate. Then copy the results or download them as a text file."]]},{slug:"bulk-guid-generator",title:"Bulk GUID Generator",desc:"Create up to 1,000 GUIDs at once and download them as a text file.",ver:"4",fmt:"D",up:!1,n:100,text:[["Generate GUIDs in bulk","Set the quantity (up to 1,000), select Generate, then use Copy or Download .txt. Results appear one per line, ready to paste into a spreadsheet, SQL script or seed file."],["Tips","Use the SQL Server format to get each value in single quotes. Use the C# format to get code you can paste straight into a test."]]},{slug:"guid-generator-without-dashes",title:"GUID Generator Without Dashes",desc:"Create GUIDs as 32 plain characters with no hyphens.",ver:"4",fmt:"N",up:!1,n:5,text:[["Why remove the dashes?",'Some systems store GUIDs as 32 characters, and hyphens can be awkward in file names or URLs. In .NET this is the N format: <code>Guid.NewGuid().ToString("N")</code>.'],["Good to know","Without dashes the value is still a valid 128-bit GUID. Add the dashes back (8-4-4-4-12) when a system expects the standard form."]]},{slug:"guid-generator-with-braces",title:"GUID Generator With Braces",desc:"Create GUIDs wrapped in curly braces, the style used in the Windows registry and many Microsoft tools.",ver:"4",fmt:"B",up:!0,n:5,text:[["Where braces are used","Braces appear in Windows registry keys, COM class IDs, installer product codes and Visual Studio files, for example {6F9619FF-8B86-D011-B42D-00C04FC964FF}. In .NET this is the B format."],["Other wrappers","Choose Parentheses (P) for the (xxxxxxxx-xxxx-...) style, or Hex array (X) for the C-style structure format."]]},{slug:"guid-generator-for-csharp",title:"GUID Generator for C#",desc:"Create GUIDs as ready-to-paste C# code.",ver:"4",fmt:"cs",up:!1,n:5,text:[["Using GUIDs in C#",'Create one at run time with Guid.NewGuid(). To hard-code a known value, use new Guid("...") or Guid.Parse("..."). This generator outputs the new Guid("...") form.'],["Code example",`<pre><code>var id = Guid.NewGuid();
var fixedId = new Guid("6f9619ff-8b86-d011-b42d-00c04fc964ff");
string text = id.ToString("D");</code></pre>`]]},{slug:"sql-server-guid-generator",title:"SQL Server GUID Generator",desc:"Create GUIDs as quoted SQL Server values.",ver:"4",fmt:"sql",up:!0,n:5,text:[["GUIDs in SQL Server","SQL Server stores GUIDs in the uniqueidentifier type. NEWID() creates a random one. NEWSEQUENTIALID() creates increasing values, but it can only be used in a column default. Random GUIDs used as clustered keys can fragment the index."],["Example",`<pre><code>CREATE TABLE Orders (
  Id uniqueidentifier NOT NULL DEFAULT NEWSEQUENTIALID() PRIMARY KEY
);

INSERT INTO Orders (Id) VALUES ('6F9619FF-8B86-D011-B42D-00C04FC964FF');</code></pre>`]]},{slug:"net-guid-generator",title:"NET GUID Generator",desc:"Create GUIDs and see every .NET format: D, N, B, P and X.",ver:"4",fmt:"D",up:!1,n:5,text:[["Guid.NewGuid() in .NET","Guid.NewGuid() returns a random (v4) GUID. Its ToString() method accepts a format specifier, and you can pick the same formats in the Format menu above."],[".NET format specifiers","<ul><li><strong>D</strong>: 32 digits with hyphens (the default)</li><li><strong>N</strong>: 32 digits, no hyphens</li><li><strong>B</strong>: hyphens inside braces</li><li><strong>P</strong>: hyphens inside parentheses</li><li><strong>X</strong>: four hex values, the last one an array of eight bytes</li></ul>"],["Code example",`<pre><code>var id = Guid.NewGuid();
id.ToString("N"); // 32 digits
id.ToString("B"); // {...}
Guid.CreateVersion7(); // .NET 9 and later</code></pre>`]]},{slug:"comb-guid-generator",title:"COMB GUID Generator",desc:"Create COMB GUIDs: random values with a timestamp in the last 6 bytes, so they sort in creation order in SQL Server.",ver:"comb",fmt:"D",up:!0,n:5,text:[["What is a COMB GUID?","COMB stands for combined GUID and timestamp, an idea from Jimmy Nilsson. It keeps most of a random GUID but fills the last 6 bytes with the current time in milliseconds. SQL Server compares those bytes first when sorting, so new values land at the end of an index instead of at random spots."],["Is it still unique?","In practice, yes. A COMB GUID keeps about 74 random bits, so duplicates remain extremely unlikely unless you create huge numbers of values in the same millisecond."],["Other databases","PostgreSQL and MySQL do not sort GUIDs the way SQL Server does. Use a v7 GUID there instead."]]}],lu={about:"<p>DevIDTools.com is a collection of practical online utilities for developers, students, QA testers, and anyone who works with structured data. The tools on this page focus on common everyday tasks such as generating UUIDs, checking identifier formats, formatting JSON, creating random strings, and converting timestamps.</p><h2>What is a UUID?</h2><p>A Universally Unique Identifier (UUID) is a 128-bit value used to identify records, objects, events, and resources. UUIDs are commonly represented as 32 hexadecimal characters separated into five groups by hyphens. A GUID is Microsoft's term for a globally unique identifier and commonly uses the same textual format.</p><h2>UUID versions at a glance</h2><ul><li><strong>UUID v4:</strong> uses random or pseudo-random data, with version and variant bits reserved by the format.</li><li><strong>UUID v5:</strong> creates a repeatable identifier from a namespace and name using SHA-1. The same namespace and name produce the same UUID.</li><li><strong>UUID v7:</strong> includes a Unix-epoch millisecond timestamp and random data, making values generally time-sortable.</li></ul><p>Choose a version based on your application requirements. UUID v5 is useful for deterministic IDs, while v4 is a common general-purpose choice and v7 can help with time-oriented database indexing. Always check the requirements of your database, framework, and application.</p><h2>Privacy and responsible use</h2><p>These tools run their main operations locally in your browser and do not require an account. Avoid pasting passwords, access tokens, personal data, or confidential production information into any online tool unless you have reviewed its privacy and security practices. Random identifiers are not a substitute for authorization, authentication, or cryptographic key management.</p>",faq:"<details><summary>Is DevIDTools.com free to use?</summary><p>Yes. The tools provided on this page are available to use without creating an account.</p></details><details><summary>What is the difference between UUID and GUID?</summary><p>UUID and GUID generally refer to the same 128-bit identifier format. GUID is a term commonly used in Microsoft ecosystems.</p></details><details><summary>Which UUID version should I choose?</summary><p>UUID v4 is a common random option, v5 is deterministic for a namespace and name, and v7 is designed to be time-sortable.</p></details><details><summary>Can I generate multiple UUIDs at once?</summary><p>Yes. Choose a quantity from 1 to 100 in the UUID generator and generate a batch.</p></details><details><summary>Does the UUID validator check whether a UUID is globally unique?</summary><p>No. It checks formatting and reports the apparent version and variant. It cannot prove that no other system has generated the same value.</p></details><details><summary>Is a UUID a secure password?</summary><p>A UUID should not be treated as a password or as the only protection for a private resource. Use a dedicated authentication and secrets-management approach.</p></details><details><summary>Why does UUID v5 need a namespace and name?</summary><p>UUID v5 combines a namespace UUID and a name to generate a stable identifier. Reusing the same inputs returns the same identifier.</p></details><details><summary>Does the JSON formatter send my data to a server?</summary><p>The formatting operation is performed in your browser by this page's JavaScript. As with any website, review hosting and privacy details before entering sensitive data.</p></details>",privacy:"<p>The tools on this page are designed to process the values you enter locally in your browser. This single-page file does not include analytics, advertising scripts, or a backend form submission. Your hosting provider may collect standard server logs when you visit the website. Do not submit confidential information to tools unless you are comfortable with the site's full hosting and privacy setup.</p>",terms:"<p>These utilities are provided for general informational and development purposes, without a guarantee that outputs are suitable for every use case. You are responsible for verifying results and testing them in your environment. Do not use generated values to bypass security controls or for unlawful purposes.</p>",disclaimer:"<p>DevIDTools.com provides general-purpose utilities \u201Cas is\u201D without warranties of any kind. Although care has been taken to implement common formats, software requirements can differ. Verify important values and consult your platform's official documentation before using generated data in production systems.</p>"};var kv={1:{desc:"Generate time-based version 1 UUIDs with a random node ID. Free, instant and private.",uses:"Good for legacy systems and logs where creation time matters. Avoid it when you do not want to reveal when an ID was made."},2:{desc:"Generate version 2 (DCE Security) UUIDs from a domain and a local ID.",uses:"Good for almost nothing new. It exists mainly for compatibility with DCE security systems."},3:{desc:"Generate name-based version 3 UUIDs using MD5, a namespac

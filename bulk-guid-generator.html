ld one.",3:"A Version 3 UUID is generated from a namespace and a name using the MD5 hash. The same inputs always produce the same UUID. MD5 is weak for security, so Version 5 is usually preferred for new work, but Version 3 is still useful when you must match an existing system.",4:"A Version 4 UUID is a 128-bit identifier made from random numbers. This page creates them with your browser\u2019s secure random number generator, so nothing is sent to a server.",5:"A Version 5 UUID is built from a namespace and a name using SHA-1. The same namespace and name always produce the same UUID.",6:"A Version 6 UUID is a reordered Version 1 UUID. The timestamp bits are rearranged so the most significant part comes first, which makes values sort by creation time. It exists to help systems that already use Version 1. For new projects, Version 7 is usually the better choice.",7:"A Version 7 UUID starts with a millisecond Unix timestamp followed by random bits, so values sort in the order they were created. That makes them a good fit for database keys.",8:"A Version 8 UUID is reserved for custom, vendor-specific layouts. The standard fixes only the version and variant bits, and you decide what the other 122 bits mean. This page fills them with random data so you can see a valid Version 8 UUID. To use your own layout, set the bytes in your code."},sv=[{slug:"guid-generator",title:"GUID Generator",desc:"Create GUIDs in the Microsoft style, with braces and uppercase letters if you need them. Pick a type and a format, then copy or download.",ver:"4",fmt:"B",up:!0,n:5,text:[["GUID or UUID?","A GUID is Microsoft's name for a UUID. Both are 128-bit identifiers with the same layout. GUIDs appear in .NET, SQL Server uniqueidentifier columns, the Windows registry and COM. They are usually written in uppercase, sometimes inside braces."],["Which type should I choose?","Random (v4) is the standard choice. Time-ordered (v7) values sort by creation time. COMB GUIDs are designed to sort well in SQL Server."]]},{slug:"random-guid-generator",title:"Random GUID Generator",desc:"Generate random GUIDs in bulk for test data, seed scripts and placeholders.",ver:"4",fmt:"D",up:!1,n:10,text:[["What is a random GUID?","A random GUID is a version 4 value. Of its 128 bits, 122 come from a secure random number generator, so collisions are so unlikely that you can treat each value as unique in practice."],["Common uses","Seeding databases, filling test fixtures, creating mock API responses and naming temporary files."]]},{slug:"guid-v4-generator",title:"GUID v4 Generator",desc:"Create version 4 GUIDs. This is the type produced by Guid.NewGuid() in .NET.",ver:"4",fmt:"D",up:!1,n:5,text:[["What does v4 mean?","The 4 is the version number, stored at the start of the third group. The first digit of the fourth group is always 8, 9, a or b. Everything else is random."],["When to use v4","Use it whenever you only need a unique value. For large database tables where insert speed matters, consider v7 or a COMB GUID."]]},{slug:"guid-v7-generator",title:"GUID v7 Generator",desc:"Create time-ordered version 7 GUIDs that sort by creation time.",ver:"7",fmt:"D",up:!1,n:5,text:[["What is a v7 GUID?","A v7 GUID starts with a 48-bit Unix timestamp in milliseconds, followed by random bits. New values are larger than older ones, which keeps database indexes tidy."],["SQL Server note","SQL Server does not sort uniqueidentifier values from the left, so v7 values will not appear in creation order there. For SQL Server, a COMB GUID is the better fit. In .NET 9 and later you can create v7 GUIDs in code with Guid.CreateVersion7()."]]},{slug:"online-guid-generator",title:"Online GUID Generator",desc:"Generate GUIDs in your browser with no install and no sign-up.",ver:"4",fmt:"D",up:!1,n:5,text:[["Free and private","This generator runs entirely in your browser using the Web Crypto API. Nothing you generate is sent to a server or stored."],["How to use it","Choose how many GUIDs you need, pick a type and a format, and select Generate. Then copy the results or download them as a text file."]]},{slug:"bulk-guid-generator",title:"Bulk GUID Generator",desc:"Create up to 1,000 GUIDs at once and download them as a text file.",ver:"4",fmt:"D",up:!1,n:100,text:[["Generate GUIDs in bulk","Set the quantity (up to 1,000), select Generate, then use Copy or Download .txt. Results appear one per line, ready to paste into a spreadsheet, SQL script or seed file."],["Tips","Use the SQL Server format to get each value in single quotes. Use the C# format to get code you can paste straight into a test."]]},{slug:"guid-generator-without-dashes",title:"GUID Generator Without Dashes",desc:"Create GUIDs as 32 plain characters with no hyphens.",ver:"4",fmt:"N",up:!1,n:5,text:[["Why remove the dashes?",'Some systems store GUIDs as 32 characters, and hyphens can be awkward in file names or URLs. In .NET this is the N format: <code>Guid.NewGuid().ToString("N")</code>.'],["Good to know","Without dashes the value is still a valid 128-bit GUID. Add the dashes back (8-4-4-4-12) when a system expects the standard form."]]},{slug:"guid-generator-with-braces",title:"GUID Generator With Braces",desc:"Create GUIDs wrapped in curly braces, the style used in the Windows registry and many Microsoft tools.",ver:"4",fmt:"B",up:!0,n:5,text:[["Where braces are used","Braces appear in Windows registry keys, COM class IDs, installer product codes and Visual Studio files, for example {6F9619FF-8B86-D011-B42D-00C04FC964FF}. In .NET this is the B format."],["Other wrappers","Choose Parentheses (P) for the (xxxxxxxx-xxxx-...) style, or Hex array (X) for the C-style structure format."]]},{slug:"guid-generator-for-csharp",title:"GUID Generator for C#",desc:"Create GUIDs as ready-to-paste C# code.",ver:"4",fmt:"cs",up:!1,n:5,text:[["Using GUIDs in C#",'Create one at run time with Guid.NewGuid(). To hard-code a known value, use new Guid("...") or Guid.Parse("..."). This generator outputs the new Guid("...") form.'],["Code example",`<pre><code>var id = Guid.NewGuid();
var fixedId = new Guid("6f9619ff-8b86-d011-b42d-00c04fc964ff");
string text = id.ToString("D");</code></pre>`]]},{slug:"sql-server-guid-generator",title:"SQL Server GUID Generator",desc:"Create GUIDs as quoted SQL Server values.",ver:"4",fmt:"sql",up:!0,n:5,text:[["GUIDs in SQL Server","SQL Server stores GUIDs in the uniqueidentifier type. NEWID() creates a random one. NEWSEQUENTIALID() creates increasing values, but it can only be used in a column default. Random GUIDs used as clustered keys can fragment the index."],["Example",`<pre><code>CREATE TABLE Orders (
  Id uniqueidentifier NOT NULL DEFAULT NEWSEQUENTIALID() PRIMARY KEY
);

INSERT INTO Orders (Id) VALUES ('6F9619FF-8B86-D011-B42D-00C04FC964FF');</code></pre>`]]},{slug:"net-guid-generator",title:"NET GUID Generator",desc:"Create GUIDs and see every .NET format: D, N, B, P and X.",ver:"4",fmt:"D",up:!1,n:5,text:[["Guid.NewGuid() in .NET","Guid.NewGuid() returns a random (v4) GUID. Its ToString() method accepts a format specifier, and you can pick the same formats in the Format menu above."],[".NET format specifiers","<ul><li><strong>D</strong>: 32 digits with hyphens (the default)</li><li><strong>N</strong>: 32 digits, no hyphens</li><li><strong>B</strong>: hyphens inside braces</li><li><strong>P</strong>: hyphens inside parentheses</li><li><strong>X</strong>: four hex values, the last one an array of eight bytes</li></ul>"],["Code example",`<pre><code>var id = Guid.NewGuid();
id.ToString("N"); // 32 digits
id.ToString("B"); // {...}
Guid.CreateVersion7(); // .NET 9 and later</code></pre>`]]},{slug:"comb-guid-generator",title:"COMB GUID Generator",desc:"Create COMB GUIDs: random values with a timestamp in the last 6 bytes, so they sort in creation order in SQL Server.",ver:"comb",fmt:"D",up:!0,n:5,text:[["What is a COMB GUID?","COMB stands for combined GUID and timestamp, an idea from Jimmy Nilsson. It keeps most of a random GUID but fills the last 6 bytes with the current time in milliseconds. SQL Server compares those bytes first when sorting, so new values land at the end of an index instead of at random spots."],["Is it still unique?","In practice, yes. A COMB GUID keeps about 74 random bits, so duplicates remain extremely unlikely unless you create huge numbers of values in the same millisecond."],["Other databases","PostgreSQL and MySQL do not sort GUIDs the way SQL Server does. Use a v7 GUID there instead."]]}],nn={about:"<p>UUIDGenerator.app is a collection of practical online utilities for developers, students, QA testers, and anyone who works with structured data. The tools on this page focus on common everyday tasks such as generating UUIDs, checking identifier formats, formatting JSON, creating random strings, and converting timestamps.</p><h2>What is a UUID?</h2><p>A Universally Unique Identifier (UUID) is a 128-bit value used to identify records, objects, events, and resources. UUIDs are commonly represented as 32 hexadecimal characters separated into five groups by hyphens. A GUID is Microsoft's term for a globally unique identifier and commonly uses the same textual format.</p><h2>UUID versions at a glance</h2><ul><li><strong>UUID v4:</strong> uses random or pseudo-random data, with version and variant bits reserved by the format.</li><li><strong>UUID v5:</strong> creates a repeatable identifier from a namespace and name using SHA-1. The same namespace and name produce the same UUID.</li><li><strong>UUID v7:</strong> includes a Unix-epoch millisecond timestamp and random data, making values generally time-sortable.</li></ul><p>Choose a version based on your application requirements. UUID v5 is useful for deterministic IDs, while v4 is a common general-purpose choice and v7 can help with time-oriented database indexing. Always check the requirements of your database, framework, and application.</p><h2>Privacy and responsible use</h2><p>These tools run their main operations locally in your browser and do not require an account. Avoid pasting passwords, access tokens, personal data, or confidential production information into any online tool unless you have reviewed its privacy and security practices. Random identifiers are not a substitute for authorization, authentication, or cryptographic key management.</p>",faq:"<details><summary>Is UUIDGenerator.app free to use?</summary><p>Yes. The tools provided on this page are available to use without creating an account.</p></details><details><summary>What is the difference between UUID and GUID?</summary><p>UUID and GUID generally refer to the same 128-bit identifier format. GUID is a term commonly used in Microsoft ecosystems.</p></details><details><summary>Which UUID version should I choose?</summary><p>UUID v4 is a common random option, v5 is deterministic for a namespace and name, and v7 is designed to be time-sortable.</p></details><details><summary>Can I generate multiple UUIDs at once?</summary><p>Yes. Choose a quantity from 1 to 100 in the UUID generator and generate a batch.</p></details><details><summary>Does the UUID validator check whether a UUID is globally unique?</summary><p>No. It checks formatting and reports the apparent version and variant. It cannot prove that no other system has generated the same value.</p></details><details><summary>Is a UUID a secure password?</summary><p>A UUID should not be treated as a password or as the only protection for a private resource. Use a dedicated authentication and secrets-management approach.</p></details><details><summary>Why does UUID v5 need a namespace and name?</summary><p>UUID v5 combines a namespace UUID and a name to generate a stable identifier. Reusing the same inputs returns the same identifier.</p></details><details><summary>Does the JSON formatter send my data to a server?</summary><p>The formatting operation is performed in your browser by this page's JavaScript. As with any website, review hosting and privacy details before entering sensitive data.</p></details>",privacy:"<p>The tools on this page are designed to process the values you enter locally in your browser. This single-page file does not include analytics, advertising scripts, or a backend form submission. Your hosting provider may collect standard server logs when you visit the website. Do not submit confidential information to tools unless you are comfortable with the site's full hosting and privacy setup.</p>",terms:"<p>These utilities are provided for general informational and development purposes, without a guarantee that outputs are suitable for every use case. You are responsible for verifying results and testing them in your environment. Do not use generated values to bypass security controls or for unlawful purposes.</p>",disclaimer:"<p>UUIDGenerator.app provides general-purpose utilities \u201Cas is\u201D without warranties of any kind. Although care has been taken to implement common formats, software requirements can differ. Verify important values and consult your platform's official documentation before using generated data in production systems.</p>"};var oo={"random-uuid-generator":{text:[["What is a random UUID?","<p>A random UUID is a version 4 UUID: a 128-bit identifier in which 122 bits come from a random number generator. The other 6 bits are fixed to mark the version and variant. That is why every random UUID follows the same pattern, <code>xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx</code>, where the <code>4</code> is the version and <code>y</code> is always 8, 9, a or b.</p><p>With 122 random bits there are about 5.3 undecillion (5.3 \xD7 10<sup>36</sup>) possible values, so you can create IDs anywhere, at any time, without checking a central list.</p>"],["How to generate a random UUID","<ol><li>Select <strong>Generate a Random UUID</strong> to create one new value.</li><li>Select Copy to put it on your clipboard.</li><li>Need many? Enter a quantity in the bulk box (up to 500) and select Generate.</li><li>Use the options to switch to uppercase, remove hyphens or add braces.</li></ol>"],["How random are these UUIDs?","<p>Every value comes from <code>crypto.getRandomValues()</code>, the cryptographically secure random number generator built into your browser. It is not <code>Math.random()</code>, which is predictable and unsuitable for identifiers. Nothing is sent to a server, so the UUIDs exist only on your device until you copy them.</p>"],["Can two random UUIDs collide?","<p>In theory yes, in practice no. You would need to generate about 2.7 quintillion random UUIDs for a 50% chance of a single duplicate. For a one-in-a-billion chance you would still need around 103 trillion. If a duplicate ever appears in your system, look for a bug, a copied value or a weak random source rather than bad luck.</p>"],["Random UUIDs vs sequential IDs",'<ul><li><strong>Pros:</strong> no coordination needed, safe to create on the client, hard to guess the next value, easy to merge data from different systems.</li><li><strong>Cons:</strong> they do not sort by creation time, take 16 bytes instead of 4 or 8, and scatter inserts across a database index.</li></ul><p>If you want UUIDs that sort by time, use the <a href="/uuid-v7-generator">UUID v7 generator</a> instead.</p>'],["Generate random UUIDs in code",`<pre><code>// JavaScript
crypto.randomUUID();

# Python
import uuid
str(uuid.uuid4())

// C#
Guid.NewGuid();

// Java
UUID.randomUUID();

// Go (github.com/google/uuid)
uuid.New()

-- PostgreSQL
SELECT gen_random_uuid();</code></pre>`]],faq:[["Is a random UUID the same as a version 4 UUID?","Yes. When people say random UUID they almost always mean version 4, which is built from random numbers."],["Are random UUIDs safe to use as database primary keys?","Yes, they work well. For very large tables, consider a time-ordered UUID (v7), because random keys spread inserts across the index and can slow writes."],["Can I use a random UUID as a password or secret key?","It is not recommended. A UUID is an identifier, not a secret, and its fixed bits make it shorter than a proper random token. Use a dedicated secret generator for passwords and API keys."],["How many random UUIDs can I generate at once?","Up to 500 per click in the bulk box, and you can click as many times as you like."]]},"bulk-uuid-generator":{text:[["Generate UUIDs in bulk","<p>This bulk UUID generator creates up to 500 version 4 UUIDs in one click, one per line, ready to paste into a spreadsheet, SQL script, JSON file or test fixture. Every value is generated in your browser, so nothing is uploaded and nothing is stored.</p>"],["How to generate bulk UUIDs","<ol><li>Enter how many UUIDs you need (1 to 500).</li><li>Choose your format: uppercase, hyphens or braces.</li><li>Select <strong>Generate</strong>.</li><li>Select <strong>Copy results</strong>, or <strong>Download to a file</strong> to save a .txt file.</li></ol>"],["Bulk UUID formats","<ul><li><strong>Standard:</strong> <code>123e4567-e89b-42d3-a456-426614174000</code></li><li><strong>Without hyphens:</strong> <code>123e4567e89b42d3a456426614174000</code></li><li><strong>With braces:</strong> <code>{123e4567-e89b-42d3-a456-426614174000}</code></li><li><strong>Uppercase:</strong> <code>123E4567-E89B-42D3-A456-426614174000</code></li></ul>"],["What people use bulk UUIDs for","<ul><li>Seeding a development or test database</li><li>Pre-assigning IDs before a CSV or spreadsheet import</li><li>Load testing and mock API responses</li><li>Creating unique file names or tokens in batches</li></ul>"],["Turn the list into SQL",`<p>Paste the list into your editor, then use find and replace to wrap each line in quotes and add a comma. A common pattern is:</p><pre><code>INSERT INTO users (id) VALUES
('123e4567-e89b-42d3-a456-426614174000'),
('9b2f5c1e-7a3d-4e8b-b1c4-5d6e7f8a9b0c');</code></pre><p>Need quotes added for you? The <a href="/sql-server-guid-generator">SQL Server GUID generator</a> outputs each value in single quotes.</p>`],["Need more than 500?",`<p>Run the generator several times, or create them in code:</p><pre><code>// JavaScript
Array.from({ length: 1000 }, () => crypto.randomUUID());

# Python
[str(uuid.uuid4()) for _ in range(1000)]

-- PostgreSQL
SELECT gen_random_uuid() FROM generate_series(1, 1000);</code></pre>`]],faq:[["How many UUIDs can I generate at once?","Up to 500 per click. Click Generate again for more."],["Are the UUIDs in a bulk list unique?","Yes. Each one is generated independently from 122 random bits, so the chance of a repeat in a list of 500 is effectively zero."],["Can I download the list?","Yes. Select Download to a file to save the results as uuids.txt."],["Does this tool store my UUIDs?","No. They are generated in your browser and disappear when you close or refresh the page."]]},"uuid-generator-without-dashes":{text:[["What is a UUID without dashes?",`<p>A UUID without dashes is the same 128-bit value written as 32 hexadecimal characters in a row. The standard form has 36 characters, with hyphens in an 8-4-4-4-12 pattern. Removing the hyphens changes only how the value is written, not the identifier itself. It is sometimes called the compact or hex form, and .NET calls it the N format.</p><pre><code>With dashes:    123e4567-e89b-42d3-a456-426614174000
Without dashes: 123e4567e89b42d3a456426614174000</code></pre>`],["How to generate a UUID without dashes","<ol><li>Select <strong>Generate a UUID Without Dashes</strong>. Hyphens are already switched off.</li><li>Copy the 32-character result.</li><li>Need hyphens back? Tick the Hyphens option under the button.</li></ol>"],["Why use the compact form?","<ul><li><strong>Shorter:</strong> 32 characters instead of 36.</li><li><strong>Cleaner in URLs, file names and cache keys,</strong> where hyphens can be awkward.</li><li><strong>Easy to select:</strong> double-clicking a value with hyphens selects only one group, while the compact form selects the whole thing.</li><li><strong>Required by some systems</strong> that store UUIDs in a fixed CHAR(32) column.</li></ul>"],["Remove the dashes in code",`<pre><code>// JavaScript
crypto.randomUUID().replaceAll("-", "");

# Python
uuid.uuid4().hex

// C#
Guid.NewGuid().ToString("N");

// Java
UUID.randomUUID().toString().replace("-", "");

-- PostgreSQL
SELECT replace(gen_random_uuid()::text, '-', '');</code></pre>`],["Add the dashes back",'<p>Insert a hyphen after characters 8, 12, 16 and 20. In JavaScript:</p><pre><code>s.replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, "$1-$2-$3-$4-$5");</code></pre><p>In Python, <code>str(uuid.UUID(hex_string))</code> does it for you.</p>'],["Storing UUIDs efficiently",'<p>If your database supports it, store the value as 16 bytes (BINARY(16) or a native UUID type) and format it only for display. Storing 32 or 36 characters of text takes two to three times the space and makes indexes larger. For a GUID version, see the <a href="/guid-generator-without-dashes">GUID generator without dashes</a>.</p>']],faq:[["Is a UUID without dashes still valid?","Yes. It is the same identifier. Many libraries accept both forms, though some require the hyphens, so check what your parser expects."],["Does removing the dashes make a UUID less unique?","No. The dashes are formatting only. All 128 bits remain."],["How long is a UUID without dashes?","32 characters. With dashes it is 36."],["What is the best way to store a UUID in a database?","As 16 binary bytes or a native UUID type where available. Text columns work but use more space."]]},"uuid-generator-with-braces":{text:[["What is a UUID with braces?","<p>A UUID with braces is a standard UUID wrapped in curly brackets, like <code>{123e4567-e89b-42d3-a456-426614174000}</code>. The braces are formatting only and do not change the value. The style comes from Microsoft, where identifiers are usually called GUIDs, and .NET calls it the B format.</p>"],["Where braces are used","<ul><li>Windows registry keys and COM class IDs (CLSIDs)</li><li>Visual Studio solution and project files</li><li>Windows Installer (MSI) product and upgrade codes</li><li>Configuration files and scripts written for Microsoft tools</li></ul>"],["How to generate a UUID with braces","<ol><li>Select <strong>Generate a UUID With Braces</strong>. Braces are already switched on.</li><li>Copy the result.</li><li>Want uppercase letters too? Choose UPPERCASE in the letter case menu.</li></ol>"],["UUID formats compared",`<p>These are the five formats .NET can produce from the same value:</p><pre><code>D  123e4567-e89b-42d3-a456-426614174000
N  123e4567e89b42d3a456426614174000
B  {123e4567-e89b-42d3-a456-426614174000}
P  (123e4567-e89b-42d3-a456-426614174000)
X  {0x123e4567,0xe89b,0x42d3,{0xa4,0x56,0x42,0x66,0x14,0x17,0x40,0x00}}</code></pre>`],["Add braces in code",`<pre><code>// C#
Guid.NewGuid().ToString("B");

// JavaScript
"{" + crypto.randomUUID() + "}";

# Python
"{%s}" % uuid.uuid4()

# PowerShell
"{" + [guid]::NewGuid() + "}"</code></pre>`],["Parsing UUIDs that have braces",`<p>.NET's <code>Guid.Parse()</code> and Python's <code>uuid.UUID()</code> accept braces. Many JavaScript libraries and databases do not, so strip the braces before storing or comparing. Braces are also unsafe in URLs, so remove them there. For uppercase Microsoft-style output, try the <a href="/guid-generator-with-braces">GUID generator with braces</a>.</p>`]],faq:[["Are the braces part of the UUID?","No. They are only a wrapper. The identifier is the 32 hex digits inside."],["Should a UUID in braces be uppercase or lowercase?","Microsoft tools usually write them in uppercase, but comparisons are case-insensitive, so both work."],["Can I use a UUID with braces in a URL?","Remove the braces first. Curly brackets are not safe in URLs and must be encoded otherwise."],["What is the difference between a UUID and a GUID?","None in practice. GUID is Microsoft's name for the same 128-bit identifier."]]}},co={1:{build:"A version 1 UUID combines a 60-bit timestamp (counted in 100-nanosecond steps since 15 October 1582), a 14-bit clock sequence and a 48-bit node ID. Decoders can read the exact creation time back out of the first three groups.",example:`c232ab00-9414-11ec-b3c8-9f6bdeced846
The 1 at the start of the third group marks version 1.`,faq:[["Does a version 1 UUID reveal my MAC address?","Traditional implementations used the network card's MAC address as the node ID, which could identify a machine. This generator uses a random node ID with the multicast bit set, as the standard allows, so nothing about your hardware is exposed."],["Can I get the creation time from a v1 UUID?","Yes. Paste it into a UUID decoder to read the timestamp it was created with."]]},2:{build:"A version 2 UUID is the DCE Security variant of version 1. The first 32 bits of the timestamp are replaced by a local identifier such as a user ID, and part of the clock sequence stores the domain: 0 for a person, 1 for a group and 2 for an organization.",example:`000003e8-c4dd-21f1-a500-638e98052f5d
000003e8 is the local ID 1000, and 21f1 shows version 2.`,faq:[["Is version 2 still used?","Rarely. Few libraries support it, and it was designed for DCE security services. Use version 4 or 7 for new work."],["What is the domain in a v2 UUID?","A number stored in the clock sequence: 0 for a person (POSIX UID), 1 for a group (POSIX GID) and 2 for an organization."]]},3:{build:"A version 3 UUID is made by hashing a namespace UUID and a name together with MD5, then overwriting 6 bits with the version and variant. The same namespace and name always give the same result.",example:`6fa459ea-ee8a-3ca4-894e-db77e160355e
Namespace DNS, name python.org.`,faq:[["Is MD5 safe for UUIDs?","UUIDs are identifiers, not security tokens, so MD5's weaknesses matter less here. Version 5 uses SHA-1 and is the usual choice for new work."],["Will the same name always give the same UUID?","Yes, as long as the namespace and name match exactly, including case and spaces."]]},4:{build:"A version 4 UUID is 122 random bits plus 6 fixed bits for the version and variant. There is no timestamp, no hardware address and no hidden data.",example:`919108f7-52d1-4320-9bac-f847db4148a8
The 4 starts the third group, and 9 starts the fourth.`,faq:[["Is v4 the best UUID version?","It is the most widely supported and ideal when you only need uniqueness. For database keys that benefit from ordering, v7 is often a better fit."],["How unique is a v4 UUID?","You would need roughly 103 trillion of them for a one-in-a-billion chance of a single duplicate."]]},5:{build:"A version 5 UUID is made by hashing a namespace UUID and a name with SHA-1, keeping 128 bits and overwriting 6 of them with the version and variant. It gives the same result for the same inputs on any machine.",example:`886313e1-3b8a-5372-9b90-0c9aee199e5d
Namespace DNS, name python.org.`,faq:[["Should I use v3 or v5?","Both are name-based. v5 uses SHA-1 and is preferred. Use v3 only to match existing data."],["Can I reverse a v5 UUID to find the name?","No, a hash cannot be reversed. Someone who guesses the name can confirm it by generating the UUID again."]]},6:{build:"A version 6 UUID uses the same timestamp, clock sequence and node as version 1, but stores the timestamp with its most significant bits first. That ordering makes the values sort by creation time.",example:`1ec9414c-232a-6b00-b3c8-9f6bdeced846
The same time as the v1 example above, reordered.`,faq:[["Should I use v6 or v7?","v7 for new projects. v6 exists to help systems already built on version 1."],["Is v6 sortable?","Yes. The timestamp comes first, so values sort in the order they were created."]]},7:{build:"A version 7 UUID starts with a 48-bit Unix timestamp in milliseconds, followed by 74 random bits (with 6 bits fixed for version and variant). The timestamp makes values sortable and the random bits keep them unique.",example:`017f22e2-79b0-7cc3-98c4-dc0c0c07398f
The first 12 hex digits are the timestamp.`,faq:[["Is v7 faster than v4 for databases?","Often, on large tables, because new rows land near the end of the index instead of scattered. Real gains depend on your database."],["Does v7 leak the creation time?","Yes. Anyone can read the timestamp, so avoid v7 where creation time must stay private."]]},8:{build:"Version 8 sets only the version and variant bits and leaves the other 122 bits to you. It is meant for custom, vendor-specific layouts, such as embedding a shard ID, a tenant ID or your own timestamp.",example:`2489e9ad-2ee2-8e00-8ec9-32d5f69181c0
An 8 starts the third group. The rest is custom.`,faq:[["What is a v8 UUID for?","Custom layouts. The standard fixes only the version and variant bits, so you decide what everything else means."],["Are the v8 UUIDs made here random?","Yes. This generator fills the free bits with random data to show a valid v8 UUID. For your own layout, set the bytes in code."]]}};var Sr={"guid-generator":{text:[["What is a GUID?","<p>A GUID (globally unique identifier) is a 128-bit value used to label records, files, components and messages without a central authority handing out numbers. It is Microsoft's name for a UUID, and the two share the same layout: 32 hexadecimal digits grouped 8-4-4-4-12, such as <code>6f9619ff-8b86-d011-b42d-00c04fc964ff</code>.</p><p>One practical difference: .NET stores the first three groups in little-endian byte order, so <code>Guid.ToByteArray()</code> returns bytes in a different order from the RFC layout used by most other languages. The text form is identical.</p>"],["How to generate a GUID","<ol><li>Choose a type: random (v4), time-ordered (v7) or COMB.</li><li>Choose a format, such as hyphens, braces or no dashes.</li><li>Set the quantity (up to 1,000) and select <strong>Generate GUIDs</strong>.</li><li>Select Copy GUIDs or Download .txt.</li></ol>"],["Which GUID type should you choose?","<ul><li><strong>Random (v4):</strong> the default, the same kind <code>Guid.NewGuid()</code> returns in .NET.</li><li><strong>Time-ordered (v7):</strong> starts with a timestamp, so values sort by creation time. Good for PostgreSQL and most databases.</li><li><strong>COMB:</strong> random with a timestamp in the last bytes, built to sort well in SQL Server.</li></ul>"],["Where GUIDs are used","<ul><li>.NET and C# applications and Entity Framework keys</li><li>SQL Server <code>uniqueidentifier</code> columns</li><li>Windows registry keys, COM class IDs and Windows Installer codes</li><li>Active Directory object identifiers</li></ul>"],["GUID formats",`<pre><code>D  6f9619ff-8b86-d011-b42d-00c04fc964ff
N  6f9619ff8b86d011b42d00c04fc964ff
B  {6f9619ff-8b86-d011-b42d-00c04fc964ff}
P  (6f9619ff-8b86-d011-b42d-00c04fc964ff)</code></pre>`],["Create a GUID in code",`<pre><code>// C#
var id = Guid.NewGuid();

# PowerShell
[guid]::NewGuid()

-- SQL Server
SELECT NEWID();

// JavaScript
crypto.randomUUID();</code></pre>`]],faq:[["What is the difference between a GUID and a UUID?","None in practice. They are the same 128-bit identifier. GUID is the Microsoft term, UUID is the standard term."],["Does Guid.NewGuid() create a random GUID?","Yes. It returns a random version 4 GUID, the same type this generator creates by default."],["Can I use a GUID as a primary key?","Yes. Random GUIDs can fragment indexes in large tables, so consider a time-ordered v7 GUID or a COMB GUID for write-heavy tables."],["Can two GUIDs be the same?","It is theoretically possible but practically never happens. You would need about 103 trillion random GUIDs for a one-in-a-billion chance of a duplicate."]]},"random-guid-generator":{text:[["What is a random GUID?","<p>A random GUID is a version 4 GUID: 122 of its 128 bits come from a random number generator, and 6 bits mark the version and variant. Every value looks like <code>xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx</code>, where <code>y</code> is 8, 9, a or b. It is the type .NET's <code>Guid.NewGuid()</code> produces.</p>"],["How to generate random GUIDs","<ol><li>Leave the type on Random (v4).</li><li>Enter how many you need and select <strong>Generate GUIDs</strong>.</li><li>Copy the list or download it as a text file.</li></ol>"],["How random and how unique?","<p>Values come from your browser's secure random number generator (<code>crypto.getRandomValues()</code>), not <code>Math.random()</code>. There are about 5.3 undecillion possible values. You would need roughly 2.7 quintillion GUIDs for a 50% chance of one duplicate, and around 103 trillion for a one-in-a-billion chance.</p>"],["Typical uses","<ul><li>Seeding databases and test fixtures</li><li>Mock API responses and sample JSON or XML</li><li>Placeholder IDs in documentation and demos</li><li>Unique names for temporary files and messages</li></ul>"],["Generate random GUIDs in code",`<pre><code>// C#
Enumerable.Range(0, 10).Select(_ => Guid.NewGuid());

# PowerShell
1..10 | ForEach-Object { [guid]::NewGuid() }

-- SQL Server
SELECT TOP (10) NEWID() FROM sys.all_objects;</code></pre>`]],faq:[["Are random GUIDs really unique?","For practical purposes, yes. Duplicates are so unlikely that you can treat every random GUID as unique."],["Is a random GUID secure enough for secrets?","Not for passwords or API keys. A GUID is an identifier, not a secret. Use a dedicated secret generator for those."],["Can I paste random GUIDs into SQL?","Yes. Keep the hyphens and wrap each value in quotes, or choose the SQL Server format to have quotes added for you."]]},"guid-v4-generator":{text:[["What is a GUID v4?",`<p>A version 4 GUID is built almost entirely from random bits. The 4 in the third group is the version, and the first digit of the fourth group is always 8, 9, a or b. There is no timestamp, no machine address and no hidden data, so a v4 GUID reveals nothing about when or where it was made.</p><pre><code>919108f7-52d1-4320-9bac-f847db4148a8
              ^    ^
          version  variant</code></pre>`],["How to generate a v4 GUID","<p>Select <strong>Generate GUIDs</strong>. The type is already set to Random (v4). Change the format for braces, no dashes or uppercase, and set the quantity up to 1,000.</p>"],["GUID v4 vs v7",'<ul><li><strong>v4</strong> is random and has no order. It is the most widely supported type.</li><li><strong>v7</strong> starts with a timestamp, so it sorts by creation time and keeps database indexes tidy.</li></ul><p>Need time order? Try the <a href="/guid-v7-generator">GUID v7 generator</a>.</p>'],["Create a v4 GUID in code",`<pre><code>// C#
Guid.NewGuid();

# PowerShell
[guid]::NewGuid()

-- SQL Server
SELECT NEWID();

// JavaScript
crypto.randomUUID();</code></pre>`]],faq:[["Is Guid.NewGuid() a v4 GUID?","Yes. In .NET, Guid.NewGuid() returns a random version 4 GUID."],["How many random bits does a v4 GUID have?","122. The other 6 bits are fixed to mark the version and variant."],["Is v4 the best choice for database keys?","It works, but random values scatter across an index. For large tables, a v7 or COMB GUID usually performs better."]]},"guid-v7-generator":{text:[["What is a GUID v7?",`<p>A version 7 GUID, defined in RFC 9562, starts with a 48-bit Unix timestamp in milliseconds followed by random bits. Because the timestamp comes first, newer values are larger than older ones and sort in creation order.</p><pre><code>017f22e2-79b0-7cc3-98c4-dc0c0c07398f
|-- timestamp --|</code></pre>`],["Why use v7?","<ul><li>New rows land near the end of the index, which reduces page splits and speeds up inserts.</li><li>You can sort by ID to get roughly chronological order.</li><li>It is still a normal GUID, so it fits existing columns and APIs.</li></ul>"],["Important: SQL Server sorts differently",'<p>SQL Server compares the last six bytes of a <code>uniqueidentifier</code> first, so a v7 GUID will not appear in creation order there. For SQL Server, use the <a href="/comb-guid-generator">COMB GUID generator</a> or <code>NEWSEQUENTIALID()</code>. PostgreSQL, MySQL with binary columns, and most other databases compare bytes left to right and suit v7 well.</p>'],["Create a v7 GUID in code",`<pre><code>// C# (.NET 9 and later)
Guid.CreateVersion7();

-- PostgreSQL 18 and later
SELECT uuidv7();</code></pre>`]],faq:[["Is GUID v7 an official standard?","Yes. It was published in RFC 9562 in 2024."],["Does a v7 GUID reveal when it was created?","Yes. Anyone can read the timestamp, so avoid v7 where creation time must stay private."],["Are two v7 GUIDs made in the same millisecond ordered?","Not guaranteed. The random bits decide the order within the same millisecond."]]},"online-guid-generator":{text:[["A free online GUID generator","<p>Generate GUIDs in your browser with no install, no account and no limits on everyday use. Pick a type and format, set a quantity, and copy the results. It works on any device, including phones.</p>"],["What it can do","<ul><li>Random (v4), time-ordered (v7) and COMB GUIDs</li><li>Hyphens, no dashes, braces, parentheses and hex array formats</li><li>C# and SQL Server output, ready to paste</li><li>Uppercase or lowercase</li><li>Up to 1,000 at a time, with copy and .txt download</li></ul>"],["Private by design","<p>Everything is generated on your device using the Web Crypto API. Your GUIDs are never uploaded, logged or stored, and nothing changes if you go offline after the page loads.</p>"],["Common ways to use it","<ul><li>Grab a GUID for a config file, test or script</li><li>Create IDs for a Visual Studio or installer project</li><li>Fill a spreadsheet or seed file with unique IDs</li></ul>"]],faq:[["Is this online GUID generator free?","Yes. It is free to use with no sign-up."],["Are my GUIDs sent to a server?","No. They are generated in your browser and never leave your device."],["Can I generate GUIDs offline?","Once the page has loaded, generation works without a connection."]]},"bulk-guid-generator":{text:[["Generate GUIDs in bulk","<p>Create up to 1,000 GUIDs at once, one per line, ready for a spreadsheet, SQL script, JSON file or seed data. Everything runs in your browser.</p>"],["How to generate bulk GUIDs","<ol><li>Set the quantity (1 to 1,000).</li><li>Choose a type and format.</li><li>Select <strong>Generate GUIDs</strong>.</li><li>Use Copy GUIDs or Download .txt.</li></ol>"],["Turn the list into SQL",`<p>Choose the SQL Server format and each value is quoted for you:</p><pre><code>INSERT INTO Orders (Id) VALUES
('6F9619FF-8B86-D011-B42D-00C04FC964FF'),
('9B2F5C1E-7A3D-4E8B-B1C4-5D6E7F8A9B0C');</code></pre>`],["Need more than 1,000?",`<pre><code>// C#
Enumerable.Range(0, 5000).Select(_ => Guid.NewGuid());

# PowerShell
1..5000 | ForEach-Object { [guid]::NewGuid() }

-- SQL Server
SELECT TOP (5000) NEWID() FROM sys.all_columns a CROSS JOIN sys.all_columns b;</code></pre>`]],faq:[["How many GUIDs can I generate at once?","Up to 1,000 per click. Generate again for more."],["Are GUIDs in a bulk list unique?","Yes. Each is created independently from random bits, so repeats are effectively impossible."],["Can I download the list?","Yes. Select Download .txt to save it as guids.txt."]]},"guid-generator-without-dashes":{text:[["What is a GUID without dashes?",`<p>It is the same 128-bit GUID written as 32 hexadecimal characters with no hyphens. In .NET this is the N format. Only the writing changes, not the identifier.</p><pre><code>With dashes:    6f9619ff-8b86-d011-b42d-00c04fc964ff
Without dashes: 6f9619ff8b86d011b42d00c04fc964ff</code></pre>`],["How to generate one","<p>Select <strong>Generate GUIDs</strong>. The format is already set to No dashes (N). Switch it back to Hyphens (D) any time.</p>"],["Why use the compact form?","<ul><li>Shorter: 32 characters instead of 36.</li><li>Cleaner in file names, URLs and cache keys.</li><li>A double-click selects the whole value instead of one group.</li><li>Needed by systems that store GUIDs in CHAR(32) columns.</li></ul>"],["Remove or restore the dashes in code",`<pre><code>// C#
Guid.NewGuid().ToString("N");
Guid.ParseExact(text, "N");

# PowerShell
[guid]::NewGuid().ToString("N")

-- SQL Server
SELECT REPLACE(CONVERT(varchar(36), NEWID()), '-', '');</code></pre>`]],faq:[["Is a GUID without dashes still valid?","Yes. .NET's Guid constructor and Guid.Parse accept it. Some other parsers require the hyphens."],["Does it affect uniqueness?","No. All 128 bits are still there."],["How long is it?","32 characters. With dashes it is 36."]]},"guid-generator-with-braces":{text:[["What is a GUID with braces?","<p>A GUID wrapped in curly brackets, like <code>{6F9619FF-8B86-D011-B42D-00C04FC964FF}</code>. This is the classic Microsoft style and the B format in .NET. The braces are only formatting.</p>"],["Where braces are used","<ul><li>Windows registry keys, for example <code>HKEY_CLASSES_ROOT\\CLSID\\{GUID}</code></li><li>COM class IDs and interface IDs</li><li>Windows Installer product and upgrade codes</li><li>Visual Studio solution and project files</li></ul>"],["How to generate one","<p>Select <strong>Generate GUIDs</strong>. The format is already Braces (B) and uppercase is on, which is how most Microsoft tools write them.</p>"],["In code",`<pre><code>// C#
Guid.NewGuid().ToString("B").ToUpper();
Guid.Parse("{6F9619FF-8B86-D011-B42D-00C04FC964FF}");

# PowerShell
"{" + [guid]::NewGuid().ToString().ToUpper() + "}"</code></pre>`]],faq:[["Are the braces part of the GUID?","No. They only wrap the value."],["Does Guid.Parse accept braces?","Yes. It accepts the plain, braces and parentheses forms."],["Uppercase or lowercase?","Microsoft tools usually write uppercase, but comparisons are case-insensitive."]]},"guid-generator-for-csharp":{text:[["How to generate a GUID in C#","<p>Use <code>Guid.NewGuid()</code> to create a random GUID at run time. To hard-code a known value in source, use the constructor or <code>Guid.Parse</code>. This generator outputs the constructor form, so you can paste it straight into a file.</p>"],["Common GUID tasks in C#",`<pre><code>var id = Guid.NewGuid();
var fixedId = new Guid("6f9619ff-8b86-d011-b42d-00c04fc964ff");
var parsed = Guid.Parse(text);
if (Guid.TryParse(text, out var g)) { }
var empty = Guid.Empty;       // all zeros
string s = id.ToString("N");  // no dashes
var v7 = Guid.CreateVersion7(); // .NET 9+</code></pre>`],["Using GUIDs with Entity Framework","<p>Entity Framework Core can generate GUID keys for you. With SQL Server, it uses a sequential GUID generator by default for <code>Guid</code> keys, which avoids the index fragmentation random GUIDs can cause.</p>"],["Tips","<ul><li>Store GUIDs in a <code>Guid</code> or <code>uniqueidentifier</code> column, not as text.</li><li>Compare GUIDs with <code>==</code>, not as strings, so case does not matter.</li><li>Never use a GUID as a secret token.</li></ul>"]],faq:[["How do I generate a GUID in C#?","Call Guid.NewGuid(). It returns a random version 4 GUID."],["What is Guid.Empty?","A GUID with all zeros, often used as an unset value."],["How do I create a time-ordered GUID in C#?","In .NET 9 and later, call Guid.CreateVersion7()."]]},"sql-server-guid-generator":{text:[["GUIDs in SQL Server","<p>SQL Server stores GUIDs in the <code>uniqueidentifier</code> type, 16 bytes each. <code>NEWID()</code> creates a random GUID. <code>NEWSEQUENTIALID()</code> creates increasing values, but it can only be used in a column default. This generator outputs each GUID in single quotes, ready to paste into a script.</p>"],["Create a table with GUID keys",`<pre><code>CREATE TABLE Orders (
  Id uniqueidentifier NOT NULL DEFAULT NEWSEQUENTIALID() PRIMARY KEY
);

INSERT INTO Orders (Id) VALUES ('6F9619FF-8B86-D011-B42D-00C04FC964FF');</code></pre>`],["Why sort order is unusual",'<p>SQL Server compares the last six bytes of a GUID first. That means random GUIDs scatter across a clustered index and cause fragmentation. A COMB GUID puts a timestamp in those last bytes so values sort in creation order. Try the <a href="/comb-guid-generator">COMB GUID generator</a>.</p>'],["Convert between text and GUID",`<pre><code>SELECT CAST('6F9619FF-8B86-D011-B42D-00C04FC964FF' AS uniqueidentifier);
SELECT CONVERT(varchar(36), NEWID());</code></pre>`]],faq:[["What is the difference between NEWID and NEWSEQUENTIALID?","NEWID creates random GUIDs. NEWSEQUENTIALID creates increasing GUIDs and works only in a default constraint."],["Should I use a GUID as a clustered key?","It works, but random GUIDs fragment the index. Use NEWSEQUENTIALID() or a COMB GUID for write-heavy tables."],["How big is a uniqueidentifier?","16 bytes, compared with 4 for an int and 8 for a bigint."]]},"net-guid-generator":{text:[["GUIDs in .NET","<p>The <code>System.Guid</code> struct represents a 128-bit identifier. <code>Guid.NewGuid()</code> returns a random version 4 GUID. The Format menu in this generator matches the standard .NET format specifiers.</p>"],["Format specifiers",`<pre><code>D  6f9619ff-8b86-d011-b42d-00c04fc964ff
N  6f9619ff8b86d011b42d00c04fc964ff
B  {6f9619ff-8b86-d011-b42d-00c04fc964ff}
P  (6f9619ff-8b86-d011-b42d-00c04fc964ff)
X  {0x6f9619ff,0x8b86,0xd011,{0xb4,0x2d,0x00,0xc0,0x4f,0xc9,0x64,0xff}}</code></pre>`],["Common operations",`<pre><code>var id = Guid.NewGuid();
id.ToString("N");
Guid.Parse(text);
Guid.TryParse(text, out var g);
byte[] bytes = id.ToByteArray();
Guid.CreateVersion7(); // .NET 9+</code></pre>`],["Byte order warning","<p>ToByteArray() returns the first three groups in little-endian order, so the bytes differ from the RFC layout used by Java, Python and databases like PostgreSQL. Convert carefully when exchanging raw bytes between systems.</p>"]],faq:[["Which .NET versions support Guid.CreateVersion7?",".NET 9 and later."],["Is Guid.NewGuid() thread-safe?","Yes. It can be called from multiple threads."],["Can I use a Guid as a dictionary key?","Yes. Guid is a value type with fast equality and hashing."]]},"comb-guid-generator":{text:[["What is a COMB GUID?","<p>COMB stands for combined GUID and timestamp, an idea popularized by Jimmy Nilsson. It keeps most of a random GUID but fills the last six bytes with the current time in milliseconds. Because SQL Server compares those bytes first, COMB GUIDs sort in creation order there, so inserts land at the end of an index instead of at random spots.</p>"],["How this generator builds one","<p>It creates 16 random bytes, sets the version and variant bits, then overwrites the final 6 bytes with a 48-bit Unix timestamp. That leaves about 74 random bits, which keeps duplicates extremely unlikely.</p>"],["COMB vs NEWSEQUENTIALID vs v7","<ul><li><strong>COMB:</strong> sorts well in SQL Server and can be created anywhere, including your app.</li><li><strong>NEWSEQUENTIALID():</strong> built in, but only usable as a column default and more predictable.</li><li><strong>v7:</strong> time-first, ideal for databases that sort left to right such as PostgreSQL.</li></ul>"],["Create a COMB GUID in C#",`<pre><code>byte[] b = Guid.NewGuid().ToByteArray();
long ms = DateTimeOffset.UtcNow.ToUnixTimeMilliseconds();
byte[] t = BitConverter.GetBytes(ms);
